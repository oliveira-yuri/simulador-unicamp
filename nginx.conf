server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Written by 40-basic-auth.sh at container start: either the auth directives or nothing.
    include /etc/nginx/auth.conf;

    # Keep the exam pages out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Question images never change for a given file name.
    location /img/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /banco.js {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
